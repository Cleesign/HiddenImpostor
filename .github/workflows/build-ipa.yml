name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned; Sideloadly signs it with your Apple ID)
        run: |
          xcodebuild \
            -project HiddenImpostor.xcodeproj \
            -scheme HiddenImpostor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HiddenImpostor.app Payload/
          zip -qry HiddenImpostor.ipa Payload
          ls -lh HiddenImpostor.ipa

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HiddenImpostor-ipa
          path: HiddenImpostor.ipa

      - name: Publish as a GitHub release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" HiddenImpostor.ipa \
            --title "Hidden Impostor build ${{ github.run_number }}" \
            --notes "Unsigned build. Install with Sideloadly." \
            --latest
