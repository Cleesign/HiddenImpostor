/* Layout: one phone-width column, a screen stack with a sticky bottom action dock. Single deliberate night theme. */
:root{
  color-scheme: dark;
  --night:#0a0b1e;        /* page ground, deep blue-black */
  --deck:#14163a;         /* raised surface */
  --deck-2:#1d2050;       /* pressed / input surface */
  --line:#2c2f6b;         /* hairlines */
  --ink:#eef0ff;          /* primary text */
  --mute:#9a9fd0;         /* secondary text, blue-biased neutral */
  --violet:#8b5cf6;       /* brand accent */
  --crew:#3dff9a;         /* crewmate neon */
  --imp:#ff2e55;          /* impostor crimson */
  --felt:#122a2a;         /* table felt */
  --font-display:"Chakra Petch", ui-sans-serif, system-ui, sans-serif;

}

body{background:var(--night);color:var(--ink);font-family:var(--font-body);

   radial-gradient(1px 1px at 30% 70%, #ffffff40 50%, transparent 51%),
   radial-gradient(1px 1px at 88% 82%, #ffffff35 50%, transparent 51%),
   radial-gradient(60% 40% at 50% -10%, #3b2a8a55, transparent 70%),
   radial-gradient(50% 35% at 100% 100%, #1b2a7a40, transparent 70%);}
.app{position:relative;z-index:1;max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{flex:1;display:flex;flex-direction:column;animation:enter .32s cubic-bezier(.2,.8,.2,1)}

.scroll{flex:1;padding-block:8px 16px;display:flex;flex-direction:column;gap:16px}
.dock{position:sticky;bottom:0;z-index:5;padding-block:20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(to bottom,transparent,var(--night) 22px)}
.group{background:var(--deck);border:1px solid var(--line);border-radius:18px}

.btn:active{transform:scale(.97)}

.btn-primary{background:var(--violet);color:#fff;box-shadow:0 8px 24px -8px #8b5cf6aa}

:focus-visible{outline:2px solid var(--crew);outline-offset:2px}

.card3d.snap .inner{transition:none}
.face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.back{background:
  repeating-linear-gradient(45deg,#2a1f6e 0 10px,#231a5e 10px 20px);border:6px solid #f1f0ff;box-shadow:0 24px 40px -10px #000c}

@keyframes fade{from{opacity:0}to{opacity:1}}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

.hero-title{font-size:clamp(48px,15vw,64px);line-height:.92;letter-spacing:-.01em;display:flex;flex-direction:column;text-wrap:balance}
.imp-word{color:var(--imp);text-shadow:0 0 28px #ff2e5566}

.fc{position:absolute;top:10px;left:50%;width:112px;aspect-ratio:5/7;max-width:100%;border-radius:14px;border:5px solid #f1f0ff;

/* ---------- Player database ----------
   players/<key> = {name, wins, losses, updatedAt}. Falls back to this device when the db is unavailable. */
let DB=null;
function loadLocal(){ try{ const b=JSON.parse(localStorage.getItem("hi-board2")||"null"); if(b&&typeof b==="object") return b; }catch(e){} return {}; }
S.board=loadLocal();
function saveBoard(){ try{ localStorage.setItem("hi-board2", JSON.stringify(S.board)); }catch(e){} }
/* Writes in flight. A snapshot can arrive between writes and still carry old values for players
   not yet saved; PENDING keeps those local values on top until each write is confirmed. */
const PENDING={};
async function writeRecord(key, rec){
  rec = rec || S.board[key]; if(!rec) return true;
  rec = {name:rec.name, wins:rec.wins|0, losses:rec.losses|0};
  S.board[key]=rec;
  if(!DB) return true;
  PENDING[key]=rec;
  const body={...rec, updatedAt:new Date().toISOString()};
  let ok=false;
  try{ await DB.doc("players/"+key).set(body); ok=true; }
  catch(e){
    if(e&&e.code==="unavailable"){ await new Promise(res=>setTimeout(res,400+Math.random()*600)); try{ await DB.doc("players/"+key).set(body); ok=true; }catch(_){} }
    else if(e&&(e.code==="invalid_argument"||e.code==="revoked")) S.dbStatus="readonly";
  }
  if(PENDING[key]===rec) delete PENDING[key];
  return ok;
}
async function logMatch(entry){
  if(!DB) return;
  try{ await DB.collection("matches").add(entry); }catch(e){}
}
async function connectDB(){
  if(window.HI_NATIVE_APP) return;
  let tries=0; while(!(window.claude&&window.claude.use) && tries++<20) await new Promise(r=>setTimeout(r,150));
  if(!(window.claude&&window.claude.use)) return;
  let db=null; try{ db=await window.claude.use("db"); }catch(e){} if(!db) return;
  DB=db; S.dbStatus="live"; let migrated=false;
  db.collection("players").onSnapshot(async snap=>{
    if(snap.empty && !snap.metadata.fromCache && !migrated && Object.keys(S.board).length){
      migrated=true; await Promise.all(Object.keys(S.board).map(k=>writeRecord(k,S.board[k]))); return; }
    migrated=true;
    const b={}; snap.docs.forEach(d=>{ const x=d.data()||{}; if(x.name) b[d.id]={name:String(x.name),wins:x.wins|0,losses:x.losses|0}; });
    for(const k in PENDING) b[k]=PENDING[k];
    S.board=b; saveBoard(); onBoardChange();
  }, ()=>{ S.dbStatus="local"; DB=null; onBoardChange(); });
}
function onBoardChange(){
  document.querySelectorAll("[data-rec]").forEach(el=>{ el.innerHTML=recBadge(S.names[+el.dataset.rec]); });
  if(S.sheet==="board") openBoard(true); else if(S.sheet==="pick") openPicker(true);
  else if((S.screen==="setup"||S.screen==="home") && !(document.activeElement && document.activeElement.tagName==="INPUT")) render();
}
function recBadge(name){
  if(!name||!name.trim()) return "";
  const r=S.board[keyOf(name)];
  if(r) return `<span style="color:var(--crew)">${r.wins}W</span> <span style="color:var(--imp)">${r.losses}L</span>`;
  return `<span class="px-2 py-0.5 rounded-full" style="background:#ff2e5522;color:#ff8da1">${t("notRegistered")}</span>`;
}
async function registerPlayers(names){
  const keys=[];
  for(const n of names){ const k=keyOf(n); if(!S.board[k]) S.board[k]={name:n.trim(),wins:0,losses:0}; keys.push(k); }
  saveBoard(); let ok=true;
  const res=await Promise.all(keys.map(k=>writeRecord(k,S.board[k])));
  return res.every(Boolean);
}
async function deletePlayer(k){
  delete PENDING[k];
  if(DB){ try{ await DB.doc("players/"+k).delete(); }catch(e){ if(e&&(e.code==="invalid_argument"||e.code==="revoked")) S.dbStatus="readonly"; return false; } }
  delete S.board[k]; saveBoard(); return true;
}

/* ---------- Audio (starts on user gesture) ---------- */
let actx=null;
function audio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){} return actx; }
function beep(freq=880, dur=.15, when=0, type="square"){
  const a=audio(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(.0001,a.currentTime+when); g.gain.exponentialRampToValueAtTime(.25,a.currentTime+when+.01);
  g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+when+dur);
  o.connect(g).connect(a.destination); o.start(a.currentTime+when); o.stop(a.currentTime+when+dur+.05);
}
function alarmSound(){ for(let i=0;i<6;i++) beep(i%2?660:990,.18,i*.22); }

/* ---------- Bottom sheets ---------- */
function closeSheet(){ S.sheet=null; $("#sheet").innerHTML=""; }
function sheet(kind,inner){
  const again = S.sheet===kind && !!$("#sheet .sheet");   // same panel refreshing: no slide-up, no fade
  S.sheet=kind;
  $("#sheet").innerHTML=`<div class="sheet-back${again?" still":""}"><div class="sheet" role="dialog">
    <div class="grab" aria-hidden="true"><span></span></div><div class="sheet-body">${inner}</div></div></div>`;
  lucide.createIcons();
  const back=$("#sheet .sheet-back"), sh=back.querySelector(".sheet");
  back.addEventListener("click",e=>{ if(e.target===back || e.target.closest("button[data-close]")) closeSheet(); });
  // Swipe down on the handle or title row to dismiss
  let y0=null, dy=0, t0=0, pid=null;
  [sh.querySelector(".grab"), sh.querySelector(".sheet-body > :first-child")].filter(Boolean).forEach(el=>{
    el.classList.add("drag-zone");
    el.addEventListener("pointerdown",e=>{ if(e.target.closest("button,input,a")) return; y0=e.clientY; dy=0; t0=performance.now(); pid=e.pointerId;
      try{ el.setPointerCapture(pid); }catch(_){} sh.style.transition="none"; });
    el.addEventListener("pointermove",e=>{ if(y0===null||e.pointerId!==pid) return; dy=Math.max(0,e.clientY-y0); sh.style.transform=`translateY(${dy}px)`; });
    const end=()=>{ if(y0===null) return; const v=dy/Math.max(1,performance.now()-t0); y0=null;
      sh.style.transition="transform .25s cubic-bezier(.2,.8,.2,1)";
      if(dy>110||v>.6){ sh.style.transform="translateY(110%)"; back.style.transition="opacity .25s"; back.style.opacity="0"; setTimeout(closeSheet,230); }
      else sh.style.transform=""; };
    el.addEventListener("pointerup",end); el.addEventListener("pointercancel",end);
  });
}
const sheetHead = title => `<div class="flex items-center justify-between gap-3"><h2 class="font-display text-2xl font-bold">${title}</h2>
  <button data-close="1" class="w-9 h-9 rounded-full grid place-items-center flex-none" style="background:var(--deck-2)" aria-label="${t("close")}">${icon("x","w-5 h-5")}</button></div>`;

      <span class="flex-1 min-w-0"><span class="block font-semibold">${t("viTitle")}</span><span class="block text-sm" style="color:var(--mute)" lang="vi">Tiếng Việt</span></span>
      <span class="switch" aria-hidden="true"><span></span></span>
    </button>
    <p class="text-sm mt-2 px-1" style="color:var(--mute)">${t("viNote")}</p>
    ${S.vi?`<div class="mt-3 rounded-xl px-4 py-3 text-center" style="background:var(--deck-2)"><div class="font-display font-bold text-lg">${S.lang==="nl"?"Koffiezetapparaat":"Coffee Maker"}</div><div class="vi-word" lang="vi">Máy pha cà phê</div></div>`:""}
    <button data-close="1" class="btn btn-primary mt-5">${t("done")}</button>`);
  $("#viToggle").addEventListener("click",()=>{ S.vi=!S.vi; try{ localStorage.setItem("hi-vi",S.vi?"1":"0"); }catch(e){} haptic(); render(); openOptions(); });
  document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{
    S.lang=b.dataset.lang; document.documentElement.lang=S.lang;
    try{ localStorage.setItem("hi-lang",S.lang); }catch(e){}
    haptic(); render(); openOptions();
  }));
}

/* Leaderboard with swipe-left delete */
function openBoard(keep){
  const prev=keep?($("#boardList")||{}).scrollTop:0;
  const canDel=S.dbStatus!=="readonly";
  const list=Object.entries(S.board).sort((a,b)=>b[1].wins-a[1].wins || a[1].losses-b[1].losses || a[1].name.localeCompare(b[1].name));
  const rows=list.length?list.map(([k,p],i)=>{ const rate=rateOf(p);
    return `<div class="swipe ${i?"border-t border-[color:var(--line)]":""}" data-k="${esc(k)}">
      ${canDel?`<button class="swipe-del" data-del="${esc(k)}">${icon("trash-2","w-5 h-5")}<span>${t("del")}</span></button>`:""}
      <div class="swipe-row flex items-center gap-3 py-3">
        <span class="w-6 text-center font-display font-bold tnum ${i===0?"text-[color:var(--crew)]":"text-[color:var(--mute)]"}">${i+1}</span>
        ${avatar(p.name)}
        <div class="flex-1 min-w-0"><div class="font-semibold truncate">${esc(p.name)}</div>
          <div class="h-1.5 rounded-full mt-1.5 overflow-hidden" style="background:var(--deck-2)"><div class="h-full rounded-full" style="width:${rate}%;background:var(--crew)"></div></div></div>
        <div class="text-right tnum text-sm pr-1"><div><b class="text-[color:var(--crew)]">${p.wins}W</b> <span class="text-[color:var(--imp)]">${p.losses}L</span></div><div class="text-[color:var(--mute)] text-xs">${t("winsPct",rate)}</div></div>
      </div>
    </div>`;}).join("")
  : `<div class="py-10 text-center text-[color:var(--mute)]">${icon("trophy","w-10 h-10 mx-auto mb-3 opacity-50")}${t("noMatches")}</div>`;
  sheet("board",`${sheetHead(t("leaderboard"))}
    <div class="text-xs text-[color:var(--mute)] flex items-center gap-1.5 mt-1">${dbNote()}</div>
    ${list.length&&canDel?`<div class="text-xs flex items-center gap-1.5 mt-1 mb-2" style="color:var(--mute)">${icon("arrow-left","w-3.5 h-3.5")} ${t("swipeHint")}</div>`:`<div class="mb-2"></div>`}
    <p id="boardMsg" class="text-sm min-h-0" style="color:var(--imp)"></p>
    <div id="boardList" class="overflow-y-auto min-h-0 flex-1">${rows}</div>
    ${list.length&&canDel?`<button id="resetBoard" class="mt-3 text-sm text-[color:var(--imp)] self-center py-2">${t("resetAll")}</button>`:""}`);
  const bl=$("#boardList"); if(bl&&prev) bl.scrollTop=prev;
  bindSwipes();
  const r=$("#resetBoard"); if(r) r.addEventListener("click",async()=>{
    if(!r.dataset.armed){ r.dataset.armed=1; r.textContent=t("resetConfirm"); return; }
    r.textContent=t("erasing");
    for(const k of Object.keys(S.board)) await deletePlayer(k);
    onBoardChange();
  });
}
function bindSwipes(){
  const OPEN=-96; let openRow=null;
  const setX=(row,x,anim)=>{ row.style.transition=anim?"transform .22s cubic-bezier(.2,.8,.2,1)":"none"; row.style.transform=x?`translateX(${x}px)`:""; row.dataset.x=x; };
  const closeOpen=except=>{ if(openRow&&openRow!==except){ setX(openRow,0,true); const d=openRow.parentElement.querySelector(".swipe-del"); if(d){ d.dataset.armed=""; d.querySelector("span").textContent=t("del"); } openRow=null; } };
  document.querySelectorAll(".swipe").forEach(wrap=>{
    const row=wrap.querySelector(".swipe-row"), del=wrap.querySelector(".swipe-del");
    if(!del) return;
    let x0=0,y0=0,base=0,mode=null,pid=null,moved=false;
    row.addEventListener("pointerdown",e=>{ x0=e.clientX; y0=e.clientY; base=+row.dataset.x||0; mode=null; pid=e.pointerId; moved=false; });
    row.addEventListener("pointermove",e=>{
      if(e.pointerId!==pid||mode==="v") return;
      const dx=e.clientX-x0, dy=e.clientY-y0;
      if(!mode){ if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){ mode="h"; try{ row.setPointerCapture(pid); }catch(_){} closeOpen(row); }
                 else if(Math.abs(dy)>8){ mode="v"; return; } else return; }
      moved=true; setX(row,Math.max(-140,Math.min(0,base+dx)),false);
    });
    const end=()=>{ if(mode==="h"){ const x=+row.dataset.x||0; if(x<OPEN/2){ setX(row,OPEN,true); openRow=row; haptic(); } else { setX(row,0,true); if(openRow===row) openRow=null; } }
      else if(!moved && (+row.dataset.x||0)<0){ setX(row,0,true); openRow=null; }
      mode=null; pid=null; };
    row.addEventListener("pointerup",end); row.addEventListener("pointercancel",end);
    del.addEventListener("click",async()=>{
      if(!del.dataset.armed){ del.dataset.armed="1"; del.querySelector("span").textContent=t("confirmDel"); haptic(20); return; }
      del.disabled=true; del.querySelector("span").textContent="…";
      const k=del.dataset.del, ok=await deletePlayer(k);
      if(!ok){ $("#boardMsg").textContent=t("deleteFailed"); del.disabled=false; del.dataset.armed=""; del.querySelector("span").textContent=t("del"); setX(row,0,true); return; }
      wrap.style.transition="opacity .2s, max-height .25s"; wrap.style.maxHeight=wrap.offsetHeight+"px"; requestAnimationFrame(()=>{ wrap.style.opacity="0"; wrap.style.maxHeight="0"; });
      setTimeout(()=>onBoardChange(),260);
    });
  });
}

/* Register */
function openRegister(missing, roster){
  const rows=missing.map((n,i)=>`<div class="flex items-center gap-3 py-2.5 ${i?"border-t border-[color:var(--line)]":""}">${avatar(n)}
    <div class="flex-1 min-w-0"><div class="font-semibold truncate">${esc(n)}</div><div class="text-xs text-[color:var(--mute)]">${t("newProfile")}</div></div></div>`).join("");
  sheet("register",`${sheetHead(t("registerTitle",missing.length))}
    <p class="text-[15px] text-[color:var(--mute)] mt-1 mb-2">${t("registerText")}</p>
    <div class="overflow-y-auto min-h-0">${rows}</div>
    <p id="regErr" class="text-sm text-[color:var(--imp)] min-h-[20px] mt-2"></p>
    <button id="regGo" class="btn btn-crew">${icon("user-plus")} ${esc(t("registerGo",missing.length))}</button>
    <button data-close="1" class="btn btn-ghost mt-2">${t("editNames")}</button>`);
  $("#regGo").addEventListener("click",async e=>{
    const b=e.currentTarget; b.disabled=true; b.textContent=t("registering");
    const ok=await registerPlayers(missing);
    if(!ok && DB){ b.disabled=false; b.innerHTML=icon("rotate-ccw")+" "+t("tryAgain"); lucide.createIcons();
      $("#regErr").textContent=S.dbStatus==="readonly"?t("regErrView"):t("regErrNet"); return; }
    closeSheet(); S.players=roster.map(n=>S.board[keyOf(n)].name); go("config");
  });
}

/* Picker */
function openPicker(keep){
  const prev=keep?($("#pickList")||{}).scrollTop:0;
  const q=S.pickQ.trim().toLowerCase();
  const all=Object.entries(S.board).sort((a,b)=>a[1].name.localeCompare(b[1].name));
  const list=all.filter(([k,p])=>!q||p.name.toLowerCase().includes(q));
  const full=S.pick.size>=10;
  const rows=list.map(([k,p],i)=>{ const on=S.pick.has(k);
    return `<button data-pk="${esc(k)}" aria-pressed="${on}" ${!on&&full?"disabled":""} class="w-full flex items-center gap-3 py-3 text-left ${i?"border-t border-[color:var(--line)]":""} ${!on&&full?"opacity-40":""}">
      ${avatar(p.name)}
      <div class="flex-1 min-w-0"><div class="font-semibold truncate">${esc(p.name)}</div>
        <div class="text-xs tnum text-[color:var(--mute)] mt-0.5">${t("wl",`<b style="color:var(--crew)">${p.wins}</b>`,`<span style="color:var(--imp)">${p.losses}</span>`)} · ${rateOf(p)}%</div></div>
      <span class="w-7 h-7 rounded-full grid place-items-center flex-none" style="${on?"background:var(--violet)":"border:2px solid var(--line)"}">${on?icon("check","w-4 h-4 text-white"):""}</span>
    </button>`;}).join("");
  const empty=!all.length?`<div class="py-10 text-center text-[color:var(--mute)]">${icon("users-round","w-10 h-10 mx-auto mb-3 opacity-50")}${t("noRegistered")}</div>`
    : !list.length?`<div class="py-8 text-center text-[color:var(--mute)]">${t("noMatch",esc(S.pickQ))}</div>`:"";
  const n=S.pick.size;
  sheet("pick",`${sheetHead(t("registeredPlayers"))}
    <div class="text-xs text-[color:var(--mute)] flex items-center gap-1.5 mt-1 mb-3">${dbNote()} · ${t("tapUpTo")}</div>
    <form id="regForm" class="flex items-center gap-2 mb-1">
      <label class="flex-1 min-w-0 flex items-center gap-2 px-3 h-11 rounded-xl" style="background:var(--deck-2)">${icon("user-plus","w-4 h-4 text-[color:var(--crew)] flex-none")}<input type="text" id="regName" maxlength="14" placeholder="${t("registerPlaceholder")}" autocomplete="off"></label>
      <button type="submit" class="h-11 px-4 rounded-xl font-semibold flex-none" style="background:var(--crew);color:#03200f">${t("add")}</button>
    </form>
    <p id="regMsg" class="text-xs min-h-[16px] mb-1"></p>
    ${all.length>6?`<label class="flex items-center gap-2 px-3 h-11 rounded-xl mb-1" style="background:var(--deck-2)">${icon("search","w-4 h-4 text-[color:var(--mute)]")}<input type="text" id="pickSearch" placeholder="${t("searchPlayers")}" autocomplete="off" value="${esc(S.pickQ)}"></label>`:""}
    <div id="pickList" class="overflow-y-auto min-h-0 flex-1">${rows}${empty}</div>
    <button id="pickUse" class="btn btn-primary mt-3" ${n?"":"disabled"}>${icon("user-check")} ${n?t("usePlayers",n)+(n<2?t("plusOneNew"):""):t("selectPlayers")}</button>`);
  const pl=$("#pickList"); if(pl&&prev) pl.scrollTop=prev;
  $("#regForm").addEventListener("submit",async e=>{
    e.preventDefault(); const inp=$("#regName"), nm=inp.value.trim(), msg=$("#regMsg");
    if(!nm){ msg.style.color="var(--imp)"; msg.textContent=t("typeName"); return; }
    const k=keyOf(nm);
    if(S.board[k]){ if(S.pick.size<10) S.pick.add(k); openPicker(true); return; }
    msg.style.color="var(--mute)"; msg.textContent=t("registering");
    const ok=await registerPlayers([nm]);
    if(!ok && DB){ delete S.board[k]; saveBoard(); msg.style.color="var(--imp)"; msg.textContent=t("couldntSave"); return; }
    if(S.pick.size<10) S.pick.add(k); S.pickQ=""; openPicker(true);
  });
  document.querySelectorAll("[data-pk]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.pk; if(S.pick.has(k)) S.pick.delete(k); else if(S.pick.size<10) S.pick.add(k); haptic(); openPicker(true); }));
  const ps=$("#pickSearch"); if(ps) ps.addEventListener("input",()=>{ S.pickQ=ps.value; const pos=ps.selectionStart; openPicker(); const n2=$("#pickSearch"); if(n2){ n2.focus(); try{n2.setSelectionRange(pos,pos);}catch(e){} } });
  $("#pickUse").addEventListener("click",()=>{
    const order=[...S.pick].filter(k=>S.board[k]).map(k=>S.board[k].name);
    S.count=Math.max(2,order.length); S.names=Array.from({length:10},(_,i)=>order[i]||"");
    closeSheet(); go("setup");
  });
}

/* ---------- Game logic ---------- */
function deal(){
  S.wordIdx=Math.floor(Math.random()*CATEGORIES[S.category].words.length);
  S.impSet=new Set(shuffle(S.players.map((_,i)=>i)).slice(0,S.impostors));
  S.peekIdx=0; S.phase="pass"; S.peeked=false; S.votes=new Set(); S.result=null;
  S.round=1; S.starter=Math.floor(Math.random()*S.players.length);
  S.timeLeft=S.total=S.minutes*60; stopTimer();
  go("pass");
}
function stopTimer(){ clearInterval(S.timerId); S.timerId=null; S.running=false; }
function startTimer(){
  stopTimer(); S.running=true;
  S.timerId=setInterval(()=>{
    S.timeLeft=Math.max(0,S.timeLeft-1);
    if(S.timeLeft<=5 && S.timeLeft>0) beep(1200,.06,0,"sine");
    if(S.timeLeft===0){ stopTimer(); alarmSound(); haptic([200,100,200,100,400]);
      const ps=$("#playScreen"); if(ps) ps.classList.add("alarm");
      setTimeout(()=>{ if(S.screen==="play") go("vote"); },2600); }
    if(S.screen==="play") updateClock();
  },1000);
}
function updateClock(){
  const total=S.total||S.minutes*60, C=2*Math.PI*108, low=S.timeLeft<=10;
  const m=Math.floor(S.timeLeft/60), sec=String(S.timeLeft%60).padStart(2,"0");
  const c=$("#clock"), a=$("#arc"); if(!c||!a) return;
  c.textContent=S.timeLeft===0?t("timeUp"):`${m}:${sec}`; c.style.color=low?"var(--imp)":"var(--ink)";
  a.setAttribute("stroke-dashoffset",C*(1-Math.min(1,S.timeLeft/total))); a.setAttribute("stroke",low?"var(--imp)":"var(--crew)");
}
function finish(){
  const crew=[...S.votes].every(i=>S.impSet.has(i)) && S.votes.size===S.impSet.size;
  S.result=crew?"crew":"imp";
  const w=CATEGORIES[S.category].words[S.wordIdx];
  // Compute every player's new record from one consistent view before anything is saved
  const updates=S.players.map((n,i)=>{
    const key=keyOf(n), cur=S.board[key]||{name:n.trim(),wins:0,losses:0};
    const imp=S.impSet.has(i), won=imp?!crew:crew;
    return {key, imp, won, voted:S.votes.has(i), rec:{name:cur.name, wins:(cur.wins|0)+(won?1:0), losses:(cur.losses|0)+(won?0:1)}};
  });
  updates.forEach(u=>{ S.board[u.key]=u.rec; });
  saveBoard(); haptic(crew?30:[60,40,60]);
  crew?[523,659,784,1047].forEach((f,i)=>beep(f,.16,i*.12,"triangle")):[400,330,262].forEach((f,i)=>beep(f,.22,i*.18,"sawtooth"));
  S.saveState=DB?"saving":"local";
  go("results");
  (async()=>{
    const res=await Promise.all(updates.map(u=>writeRecord(u.key,u.rec)));
    const ok=res.every(Boolean);
    logMatch({at:new Date().toISOString(), result:S.result, category:S.category, word:w[0],
      players:updates.map(u=>({key:u.key, name:u.rec.name, role:u.imp?"impostor":"crew", won:u.won, votedOut:u.voted})), saved:ok});
    S.saveState=DB?(ok?"saved":"failed"):"local"; const el=$("#saveState"); if(el){ el.innerHTML=saveStateHtml(); lucide.createIcons(); }
  })();
}

/* ---------- Events ---------- */
function bind(){
  document.querySelectorAll("[data-name]").forEach(el=>el.addEventListener("input",()=>{
    const i=+el.dataset.name; S.names[i]=el.value; const av=el.previousElementSibling; const n=el.value||String(i+1);
    av.style.background=color(n); av.textContent=(n.trim()[0]||"?").toUpperCase();
    const rb=document.querySelector(`[data-rec="${i}"]`); if(rb) rb.innerHTML=recBadge(el.value);
  }));
  document.querySelectorAll("[data-imp]").forEach(b=>b.onclick=()=>{S.impostors=+b.dataset.imp; haptic(); render();});
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{S.category=b.dataset.cat; haptic(); render();});
  document.querySelectorAll("[data-fmt]").forEach(b=>b.onclick=()=>{S.format=b.dataset.fmt; haptic(); render();});
  document.querySelectorAll("[data-rounds]").forEach(b=>b.onclick=()=>{S.rounds=+b.dataset.rounds; haptic(); render();});
  const mr=$("#minutes"); if(mr) mr.oninput=()=>{ S.minutes=+mr.value; $("#minLabel").textContent=S.minutes+" "+t("min"); };
  document.querySelectorAll("[data-vote]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.vote, need=S.impSet.size;
    if(S.votes.has(i)) S.votes.delete(i); else { if(need===1) S.votes.clear(); if(S.votes.size<need) S.votes.add(i); }
    haptic(); render();
  });
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act));
  const card=$("#card");
  if(card){
    const show=e=>{ e.preventDefault(); card.classList.remove("snap"); card.classList.add("flipped"); haptic(15);
      if(!S.peeked){ S.peeked=true; const sb=$("#seenBtn"); if(sb) sb.disabled=false; } };
    const hide=()=>{ if(!card.classList.contains("flipped")) return; card.classList.add("snap"); card.classList.remove("flipped"); };
    card.addEventListener("pointerdown",e=>{ try{card.setPointerCapture(e.pointerId);}catch(_){} show(e); });
    ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>card.addEventListener(ev,hide));
    card.addEventListener("contextmenu",e=>e.preventDefault());
    card.addEventListener("keydown",e=>{ if(e.key===" "||e.key==="Enter") show(e); });
    card.addEventListener("keyup",hide); card.tabIndex=0;
  }
}
function act(a){
  haptic();
  switch(a){
    case "board": openBoard(); break;
    case "options": openOptions(); break;
    case "minus": if(S.count>2){S.count--; render();} break;
    case "plus": if(S.count<10){S.count++; render();} break;
    case "toHome": stopTimer(); go("home"); break;
    case "toSetup": stopTimer(); go("setup"); break;
    case "pick": S.pick=new Set(S.names.slice(0,S.count).filter(n=>n&&n.trim()&&S.board[keyOf(n)]).map(keyOf)); S.pickQ=""; openPicker(); break;
    case "toConfig": {
      const names=S.names.slice(0,S.count).map(n=>(n||"").trim());
      if(names.some(n=>!n)){ $("#err").textContent=t("errEmpty"); return; }
      const keys=names.map(keyOf);
      if(new Set(keys).size!==keys.length){ $("#err").textContent=t("errDup"); return; }
      const missing=names.filter(n=>!S.board[keyOf(n)]);
      if(missing.length){ openRegister(missing,names); return; }
      S.players=names.map(n=>S.board[keyOf(n)].name); go("config"); break; }
    case "deal": audio(); deal(); break;
    case "iam": S.phase="peek"; S.peeked=false; render(); break;
    case "seen":
      if(S.peekIdx<S.players.length-1){ S.peekIdx++; S.phase="pass"; S.peeked=false; render(); } else go("ready");
      break;
    case "start": audio(); beep(660,.1); beep(990,.14,.12);
      if(S.format==="timer"){ S.timeLeft=S.total=S.minutes*60; go("play"); startTimer(); } else { S.round=1; go("play"); }
      break;
    case "pause": if(S.running) stopTimer(); else if(S.timeLeft>0) startTimer(); render(); break;
    case "addmin": S.timeLeft+=30; S.total=Math.max(S.total,S.timeLeft); updateClock(); break;
    case "roundDone": beep(880,.1,0,"triangle"); if(S.round<S.rounds){ S.round++; render(); } else go("vote"); break;
    case "endGame": stopTimer(); go("vote"); break;
    case "reveal": finish(); break;
    case "again": S.votes=new Set(); go("config"); break;
  }
}
render();
connectDB();
</script>
